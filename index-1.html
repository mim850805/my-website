<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08040e">
<title>致 Baby ❤</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:#08040e;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    color:#fff;
  }
  #scene{position:fixed;inset:0;display:block;z-index:0}

  .stage{
    position:fixed;inset:0;z-index:2;
    display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
    padding:0 22px max(6vh,26px);
    text-align:center;pointer-events:none;
  }
  .eyebrow{
    font-size:10px;letter-spacing:.46em;text-indent:.46em;
    color:rgba(255,190,212,.5);margin-bottom:14px;text-transform:uppercase;
    animation:fadeUp .9s ease both;
  }
  .title{
    font-size:clamp(19px,4.8vw,30px);font-weight:600;letter-spacing:.03em;
    line-height:1.55;margin:0 0 12px;min-height:1.55em;
    text-shadow:0 0 26px rgba(255,70,125,.6),0 0 60px rgba(255,40,100,.35);
  }
  .caret{
    display:inline-block;width:2px;height:.92em;background:#ff7098;
    vertical-align:-2px;margin-left:3px;border-radius:2px;
    animation:blink 1s steps(1,end) infinite;transition:opacity .4s ease;
  }
  .caret.done{opacity:0;animation:none}
  @keyframes blink{50%{opacity:0}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .sub{
    font-size:clamp(13px,3.5vw,16px);line-height:1.75;margin:0 0 24px;
    max-width:560px;color:rgba(255,224,236,.72);
    opacity:0;transition:opacity 1.1s ease;
  }
  .sub.show{opacity:1}

  button{font-family:inherit}
  .primary{
    pointer-events:auto;border:none;cursor:pointer;
    padding:14px 34px;border-radius:999px;font-size:15px;font-weight:700;
    color:#41061c;letter-spacing:.02em;
    background:linear-gradient(135deg,#ffe0ea 0%,#ffb0c9 45%,#ff7ea8 100%);
    box-shadow:0 12px 34px rgba(255,70,125,.36),inset 0 1px 0 rgba(255,255,255,.7);
    transition:transform .22s cubic-bezier(.2,.9,.3,1.3),box-shadow .22s ease,opacity .3s ease;
  }
  .primary:hover{transform:translateY(-2px) scale(1.035);box-shadow:0 18px 44px rgba(255,70,125,.5),inset 0 1px 0 rgba(255,255,255,.8)}
  .primary:active{transform:translateY(0) scale(.97)}
  .cta{opacity:0;transform:translateY(10px);transition:opacity .6s ease,transform .6s ease}
  .cta.show{opacity:1;transform:none}

  /* ---------- 表白卡片 ---------- */
  .overlay{
    position:fixed;inset:0;z-index:4;background:rgba(5,1,10,.55);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    opacity:0;pointer-events:none;transition:opacity .45s ease;
  }
  .overlay.show{opacity:1}
  .card{
    position:fixed;z-index:5;left:50%;top:50%;
    width:min(88vw,384px);padding:28px 26px 24px;border-radius:26px;
    background:linear-gradient(165deg,rgba(46,13,36,.96),rgba(18,5,20,.98));
    border:1px solid rgba(255,140,178,.28);
    box-shadow:0 34px 90px rgba(0,0,0,.65),0 0 60px rgba(255,60,120,.18),inset 0 1px 0 rgba(255,255,255,.07);
    text-align:center;
    opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.9);
    transition:opacity .45s ease,transform .5s cubic-bezier(.2,.9,.3,1.25);
  }
  .card.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .cardHeart{
    font-size:26px;line-height:1;margin-bottom:18px;color:#ff6d99;
    filter:drop-shadow(0 0 14px rgba(255,80,135,.85));
    animation:beat 1.4s ease-in-out infinite;
  }
  @keyframes beat{0%,100%{transform:scale(1)}18%{transform:scale(1.22)}36%{transform:scale(1)}54%{transform:scale(1.14)}}
  .lines p{
    margin:0 0 12px;font-size:14.5px;line-height:1.85;color:rgba(255,231,240,.9);
    opacity:0;
  }
  .card.show .lines p{animation:lineIn .7s cubic-bezier(.2,.9,.3,1.1) both}
  @keyframes lineIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .question{
    margin:20px 0 20px;font-size:16px;font-weight:700;letter-spacing:.02em;
    color:#ffd0e0;text-shadow:0 0 20px rgba(255,80,135,.6);opacity:0;
  }
  .card.show .question{animation:lineIn .7s cubic-bezier(.2,.9,.3,1.1) both}
  .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;opacity:0}
  .card.show .actions{animation:lineIn .7s cubic-bezier(.2,.9,.3,1.1) both}
  .ghost{
    pointer-events:auto;cursor:pointer;border:1px solid rgba(255,150,185,.32);
    background:transparent;color:rgba(255,205,222,.8);
    padding:13px 22px;border-radius:999px;font-size:14px;font-weight:600;
    transition:all .25s ease;
  }
  .ghost:hover{background:rgba(255,120,170,.12);border-color:rgba(255,150,185,.6)}
  .hidden{display:none !important}
  .final p{
    margin:6px 0 22px;font-size:15px;line-height:1.9;color:rgba(255,235,243,.92);
  }
  .final{animation:lineIn .7s cubic-bezier(.2,.9,.3,1.1) both}
  .tip{
    position:fixed;left:0;right:0;bottom:10px;z-index:2;text-align:center;
    font-size:10.5px;letter-spacing:.18em;color:rgba(255,190,212,.28);
    pointer-events:none;
  }
  @media (max-height:560px){
    .title{font-size:17px}
    .sub{display:none}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="stage">
  <div class="eyebrow">FOR&nbsp;YOU</div>
  <h1 class="title"><span id="typed"></span><span class="caret" id="caret"></span></h1>
  <p class="sub" id="sub"></p>
  <button class="primary cta" id="cta">点我一下 ❤</button>
</div>

<div class="tip">点击屏幕任意位置，会有小惊喜 ✦</div>

<div class="overlay" id="overlay"></div>
<div class="card" id="card">
  <div class="cardHeart">❤</div>
  <div class="lines" id="lines"></div>
  <p class="question" id="question"></p>
  <div class="actions" id="actions">
    <button class="primary" id="yes">好呀 ❤</button>
    <button class="ghost" id="no">再想想…</button>
  </div>
  <div class="final hidden" id="final">
    <p id="finalText"></p>
    <button class="primary" id="closeCard">❤ 收下这份心意</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ==================== ① 想改的内容都在这里 ==================== */
  var CONFIG = {
    eyebrow: 'FOR YOU',
    title: '我爱你，baobao',
    sub: '有些话，想认认真真地说给你听。',
    cardLines: [
      '遇见你之后，我的世界忽然有了颜色。',
      '你笑的时候，我连风都觉得是甜的。',
      '我想把所有的温柔和耐心，都留给同一个人——',
      '那个人，是你。'
    ],
    question: '一直陪着我，好吗？',
    yes: '好呀 ❤',
    no: '再想想…',
    noMore: '不行的，你只能选「好呀」😌',
    final: '谢谢你。往后的日子，我会用很久很久，去证明这句话。'
  };
  /* ============================================================== */

  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0, DPR = 1, cx = 0, cy = 0, f = 12;

  var OUTLINE_COLORS = [
    'rgba(255,196,222,0.95)',
    'rgba(255,152,196,1)',
    'rgba(255,228,241,0.85)',
    'rgba(255,120,178,1)'
  ];
  var FILL_COLORS = [
    'rgba(255,236,245,0.42)',
    'rgba(255,255,255,0.34)',
    'rgba(255,186,214,0.38)',
    'rgba(255,214,232,0.30)'
  ];

  /* ---------- 心形（参数方程）---------- */
  // x = 16 sin^3 t
  // y = 13cos t - 5cos2t - 2cos3t - cos4t   （y 轴向上）
  var UNIT = [];
  (function buildUnitPoly() {
    var N = 200;
    for (var i = 0; i < N; i++) {
      var t = (i / N) * Math.PI * 2;
      var x = 16 * Math.pow(Math.sin(t), 3);
      var y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      UNIT.push([x, y + 2.6]);   // 竖直方向居中
    }
  })();

  function pointInPoly(px, py, poly) {
    var inside = false;
    for (var i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      var xi = poly[i][0], yi = poly[i][1];
      var xj = poly[j][0], yj = poly[j][1];
      if ((yi > py) !== (yj > py) && px < ((xj - xi) * (py - yi)) / (yj - yi) + xi) {
        inside = !inside;
      }
    }
    return inside;
  }

  /* ---------- 粒子 ---------- */
  var parts = [];
  var ambient = [];
  var bursts = [];

  function buildParticles() {
    parts = [];
    var small = window.innerWidth < 560;

    var outlineN = small ? 320 : 460;
    for (var i = 0; i < outlineN; i++) {
      var idx = (i / outlineN) * UNIT.length;
      var j = Math.floor(idx) % UNIT.length;
      var k = (j + 1) % UNIT.length;
      var fr = idx - Math.floor(idx);
      var ux = UNIT[j][0] + (UNIT[k][0] - UNIT[j][0]) * fr;
      var uy = UNIT[j][1] + (UNIT[k][1] - UNIT[j][1]) * fr;
      parts.push({
        ux: ux, uy: uy,
        size: 1.05 + Math.random() * 1.5,
        ci: i % OUTLINE_COLORS.length,
        edge: true,
        x: 0, y: 0,
        k: 0.05 + Math.random() * 0.05
      });
    }

    var fillN = small ? 150 : 240;
    var added = 0, guard = 0;
    while (added < fillN && guard < fillN * 80) {
      guard++;
      var fx = (Math.random() * 2 - 1) * 15.6;
      var fy = (Math.random() * 2 - 1) * 14.0;
      if (pointInPoly(fx, fy, UNIT)) {
        parts.push({
          ux: fx, uy: fy,
          size: 0.7 + Math.random() * 1.2,
          ci: added % FILL_COLORS.length,
          edge: false,
          x: 0, y: 0,
          k: 0.04 + Math.random() * 0.04
        });
        added++;
      }
    }

    // 初始散落在画面外
    for (var m = 0; m < parts.length; m++) {
      var ang = Math.random() * Math.PI * 2;
      var rad = Math.max(W, H) * (0.55 + Math.random() * 0.5);
      parts[m].x = cx + Math.cos(ang) * rad;
      parts[m].y = cy + Math.sin(ang) * rad;
    }
  }

  function initAmbient() {
    ambient = [];
    var n = window.innerWidth < 560 ? 13 : 22;
    for (var i = 0; i < n; i++) {
      ambient.push({
        x: Math.random() * W,
        y: Math.random() * H,
        s: 5 + Math.random() * 15,
        vy: 0.22 + Math.random() * 0.7,
        vx: (Math.random() - 0.5) * 0.3,
        a: 0.05 + Math.random() * 0.15,
        ph: Math.random() * Math.PI * 2
      });
    }
  }

  function heartPathUnit(g, x, y, size) {
    g.save();
    g.translate(x, y);
    g.scale(size, size);
    g.beginPath();
    g.moveTo(0, 0.3);
    g.bezierCurveTo(0, -0.35, -1, -0.35, -1, 0.3);
    g.bezierCurveTo(-1, 0.95, 0, 1.2, 0, 1.75);
    g.bezierCurveTo(0, 1.2, 1, 0.95, 1, 0.3);
    g.bezierCurveTo(1, -0.35, 0, -0.35, 0, 0.3);
    g.closePath();
    g.restore();
  }

  function burst(x, y, n) {
    for (var i = 0; i < n; i++) {
      var ang = Math.random() * Math.PI * 2;
      var sp = 1.6 + Math.random() * 6.5;
      bursts.push({
        x: x, y: y,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp - 1.4,
        life: 1,
        decay: 0.008 + Math.random() * 0.013,
        s: 1.4 + Math.random() * 3,
        isHeart: Math.random() < 0.3,
        hue: Math.random() < 0.5 ? '255,110,160' : '255,180,210'
      });
    }
    if (bursts.length > 900) bursts.splice(0, bursts.length - 900);
  }

  /* ---------- 布局 ---------- */
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    cx = W / 2;
    cy = H * 0.36;

    var availW = Math.min(W * 0.78, 540);
    var availH = Math.min(H * 0.44, 440);
    f = Math.min(availW / 32, availH / 28.8);
  }

  /* ---------- 心跳 ---------- */
  function beatAt(t) {
    var x = (t * 1.08) % 1;
    var p1 = Math.exp(-Math.pow((x - 0.10) / 0.05, 2));
    var p2 = 0.5 * Math.exp(-Math.pow((x - 0.28) / 0.07, 2));
    return 1 + 0.062 * (p1 + p2);
  }

  /* ---------- 主循环 ---------- */
  var t0 = 0;

  function frame(now) {
    if (!t0) t0 = now;
    var t = (now - t0) / 1000;
    var b = beatAt(t);
    var appear = Math.min(1, t / 1.3);

    // 背景拖尾
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(8,3,14,0.34)';
    ctx.fillRect(0, 0, W, H);

    // 光晕
    ctx.globalCompositeOperation = 'lighter';
    var gr = ctx.createRadialGradient(cx, cy, 0, cx, cy, f * 22 * b);
    gr.addColorStop(0, 'rgba(255,60,120,' + (0.20 * appear).toFixed(3) + ')');
    gr.addColorStop(0.5, 'rgba(255,40,100,' + (0.07 * appear).toFixed(3) + ')');
    gr.addColorStop(1, 'rgba(255,40,100,0)');
    ctx.fillStyle = gr;
    ctx.beginPath();
    ctx.arc(cx, cy, f * 22 * b, 0, 6.2832);
    ctx.fill();

    // 实心心形
    ctx.globalCompositeOperation = 'source-over';
    ctx.beginPath();
    for (var i = 0; i < UNIT.length; i++) {
      var X = cx + UNIT[i][0] * f * b;
      var Y = cy - UNIT[i][1] * f * b;
      if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
    }
    ctx.closePath();

    var g = ctx.createRadialGradient(cx, cy - f * 3.5, f * 1, cx, cy + f * 2, f * 17);
    g.addColorStop(0, '#ffa8c8');
    g.addColorStop(0.35, '#ff4f86');
    g.addColorStop(0.75, '#d81b56');
    g.addColorStop(1, '#8d0e35');
    ctx.globalAlpha = appear;
    ctx.shadowBlur = f * 1.6;
    ctx.shadowColor = 'rgba(255,60,120,0.9)';
    ctx.fillStyle = g;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;

    // 粒子
    ctx.globalCompositeOperation = 'lighter';
    for (var p = 0; p < parts.length; p++) {
      var pt = parts[p];
      var tx = cx + pt.ux * f * b;
      var ty = cy - pt.uy * f * b;
      pt.x += (tx - pt.x) * pt.k;
      pt.y += (ty - pt.y) * pt.k;
      ctx.beginPath();
      ctx.arc(
        pt.x + (Math.random() - 0.5) * 0.9,
        pt.y + (Math.random() - 0.5) * 0.9,
        pt.size, 0, 6.2832
      );
      ctx.fillStyle = pt.edge ? OUTLINE_COLORS[pt.ci] : FILL_COLORS[pt.ci];
      ctx.fill();
    }

    // 飘浮的小爱心
    for (var a = 0; a < ambient.length; a++) {
      var am = ambient[a];
      am.y -= am.vy;
      am.x += am.vx + Math.sin(t * 0.8 + am.ph) * 0.35;
      if (am.y < -50) { am.y = H + 50; am.x = Math.random() * W; }
      if (am.x < -60) am.x = W + 60;
      if (am.x > W + 60) am.x = -60;
      heartPathUnit(ctx, am.x, am.y, am.s);
      ctx.fillStyle = 'rgba(255,96,150,' + am.a.toFixed(3) + ')';
      ctx.fill();
    }

    // 点击爆发的粒子
    for (var q = bursts.length - 1; q >= 0; q--) {
      var bu = bursts[q];
      bu.x += bu.vx;
      bu.y += bu.vy;
      bu.vy += 0.05;
      bu.vx *= 0.985;
      bu.vy *= 0.985;
      bu.life -= bu.decay;
      if (bu.life <= 0) { bursts.splice(q, 1); continue; }
      if (bu.isHeart) {
        heartPathUnit(ctx, bu.x, bu.y, bu.s * 1.6);
        ctx.fillStyle = 'rgba(' + bu.hue + ',' + (bu.life * 0.9).toFixed(3) + ')';
      } else {
        ctx.beginPath();
        ctx.arc(bu.x, bu.y, bu.s, 0, 6.2832);
        ctx.fillStyle = 'rgba(' + bu.hue + ',' + (bu.life * 0.8).toFixed(3) + ')';
      }
      ctx.fill();
    }

    requestAnimationFrame(frame);
  }

  /* ---------- 文字 / 交互 ---------- */
  var typedEl = document.getElementById('typed');
  var caretEl = document.getElementById('caret');
  var subEl = document.getElementById('sub');
  var ctaBtn = document.getElementById('cta');
  var overlay = document.getElementById('overlay');
  var card = document.getElementById('card');
  var linesEl = document.getElementById('lines');
  var questionEl = document.getElementById('question');
  var actionsEl = document.getElementById('actions');
  var yesBtn = document.getElementById('yes');
  var noBtn = document.getElementById('no');
  var finalEl = document.getElementById('final');
  var finalTextEl = document.getElementById('finalText');
  var closeBtn = document.getElementById('closeCard');

  document.querySelector('.eyebrow').textContent = CONFIG.eyebrow;

  function typeText(el, text, speed, done) {
    var i = 0;
    el.textContent = '';
    (function step() {
      if (i <= text.length) {
        el.textContent = text.slice(0, i);
        i++;
        setTimeout(step, speed + Math.random() * 45);
      } else if (done) {
        done();
      }
    })();
  }

  function initCard() {
    linesEl.innerHTML = '';
    for (var i = 0; i < CONFIG.cardLines.length; i++) {
      var p = document.createElement('p');
      p.textContent = CONFIG.cardLines[i];
      p.style.animationDelay = (0.35 + i * 0.28).toFixed(2) + 's';
      linesEl.appendChild(p);
    }
    questionEl.textContent = CONFIG.question;
    questionEl.style.animationDelay = (0.35 + CONFIG.cardLines.length * 0.28).toFixed(2) + 's';
    actionsEl.style.animationDelay = (0.55 + CONFIG.cardLines.length * 0.28).toFixed(2) + 's';
    yesBtn.textContent = CONFIG.yes;
    noBtn.textContent = CONFIG.no;
    finalTextEl.textContent = CONFIG.final;
  }

  function openCard() {
    card.classList.add('show');
    overlay.classList.add('show');
    burst(W / 2, H * 0.36, 90);
  }

  function closeCard() {
    card.classList.remove('show');
    overlay.classList.remove('show');
  }

  var noCount = 0;

  ctaBtn.addEventListener('click', openCard);
  overlay.addEventListener('click', closeCard);

  yesBtn.addEventListener('click', function () {
    linesEl.classList.add('hidden');
    questionEl.classList.add('hidden');
    actionsEl.classList.add('hidden');
    finalEl.classList.remove('hidden');
    for (var i = 0; i < 6; i++) {
      (function (n) {
        setTimeout(function () {
          burst(
            W * (0.2 + Math.random() * 0.6),
            H * (0.25 + Math.random() * 0.5),
            60
          );
        }, n * 130);
      })(i);
    }
  });

  noBtn.addEventListener('click', function () {
    noCount++;
    if (noCount === 1) {
      noBtn.textContent = CONFIG.noMore;
      noBtn.style.transform = 'scale(.9)';
      noBtn.style.opacity = '0.85';
    } else {
      noBtn.style.transition = 'opacity .4s ease';
      noBtn.style.opacity = '0';
      noBtn.style.pointerEvents = 'none';
    }
  });

  closeBtn.addEventListener('click', closeCard);

  window.addEventListener('pointerdown', function (e) {
    if (e.target.closest && e.target.closest('.card')) return;
    burst(e.clientX, e.clientY, 26);
  });

  window.addEventListener('resize', function () {
    resize();
    initAmbient();
  });
  window.addEventListener('orientationchange', function () {
    setTimeout(function () { resize(); initAmbient(); }, 250);
  });

  /* ---------- 启动 ---------- */
  resize();
  buildParticles();
  initAmbient();
  initCard();
  requestAnimationFrame(frame);

  setTimeout(function () {
    typeText(typedEl, CONFIG.title, 95, function () {
      caretEl.classList.add('done');
      subEl.textContent = CONFIG.sub;
      subEl.classList.add('show');
      setTimeout(function () { ctaBtn.classList.add('show'); }, 420);
    });
  }, 600);
})();
</script>
</body>
</html>
